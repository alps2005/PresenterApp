name: Release

# Push a tag like v0.1.0 to build the app and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit (v1.7.0) and an exact Xcode, so a new runner image or a moved tag can't change the
      # build. Update both together; the project file needs Xcode 26 or later.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test PresenterCore
        working-directory: Packages/PresenterCore
        run: swift test

      # Ad-hoc signed: no Apple Developer account needed. macOS asks users to confirm on first launch.
      # A generic destination builds for Apple Silicon and Intel; 'platform=macOS' would build only for the
      # runner's own chip. The version comes from the tag: v0.1.0-beta.1 → 0.1.0, with the run number as build.
      - name: Build Release app
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          xcodebuild -project Presenter.xcodeproj -scheme Presenter -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build

      - name: Check the app runs on both Mac chips
        run: |
          archs=$(lipo -archs build/Build/Products/Release/Presenter.app/Contents/MacOS/Presenter)
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::Expected arm64 and x86_64"; exit 1; }

      - name: Zip app
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Presenter.app "Presenter-${GITHUB_REF_NAME}.zip"

      # Tags with a suffix (v0.1.0-beta.1) are published as pre-releases. Hand-written notes in
      # docs/release-notes/<tag>.md are used when present; otherwise GitHub lists the merged changes.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Presenter $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "Presenter-${GITHUB_REF_NAME}.zip" "${args[@]}"
