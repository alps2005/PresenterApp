name: Release

# Push a tag like v0.1.0 to build the app and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test PresenterCore
        working-directory: Packages/PresenterCore
        run: swift test

      # Ad-hoc signed: no Apple Developer account needed. macOS asks users to confirm on first launch.
      - name: Build Release app
        run: |
          xcodebuild -project Presenter.xcodeproj -scheme Presenter -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

      - name: Zip app
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Presenter.app "Presenter-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Presenter-${GITHUB_REF_NAME}.zip" \
            --title "Presenter $GITHUB_REF_NAME" --generate-notes
