name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit (v1.7.0) and an exact Xcode, so a new runner image or a moved tag can't change the
      # build. Update both together; the project file needs Xcode 26 or later.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Show Xcode version
        run: xcodebuild -version

      # The core package's build products, keyed on its sources, so unchanged code isn't rebuilt.
      - uses: actions/cache@v4
        with:
          path: Packages/PresenterCore/.build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Packages/PresenterCore/Package.swift', 'Packages/PresenterCore/Sources/**', 'Packages/PresenterCore/Tests/**') }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-

      - name: Test PresenterCore
        working-directory: Packages/PresenterCore
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project Presenter.xcodeproj -scheme Presenter -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  # The engine on Windows, for the Windows version (docs/adr/0003-windows-shared-engine.md). Tests that make real
  # media files with Apple's frameworks are left out there; everything else runs.
  core-windows:
    runs-on: windows-latest
    steps:
      # Keep the files' own line endings, as on the Mac.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Pinned to a commit (v0.5.1) and the same Swift as Xcode 26.6 (6.4.2). Update them together.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE

      - name: Show Swift version
        run: swift --version

      - name: Test PresenterCore
        working-directory: Packages/PresenterCore
        run: swift test
