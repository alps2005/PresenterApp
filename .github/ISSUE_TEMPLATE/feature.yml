name: Feature request
description: Suggest something Presenter should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in a service or event, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. If another app (ProPresenter, EasyWorship…) does it well, say how.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do now instead?
